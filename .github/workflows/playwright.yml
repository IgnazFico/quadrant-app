name: Playwright Tests

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run full E2E suite (including live-login.spec.ts)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      # Staging database — the Next.js dev server (spun up by Playwright's
      # webServer config) connects to this DB. Must point at the same staging
      # Neon DB that Vercel Preview deployments use, so the seeded test user
      # (ignaz.fico@quadrant.com) is available.
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}

      # Auth + crypto secrets the app needs at runtime.
      # Must match the values configured as Preview env vars on Vercel.
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      FAKE_SALT_SECRET: ${{ secrets.FAKE_SALT_SECRET }}
      FAKE_KEY_SECRET: ${{ secrets.FAKE_KEY_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Seed staging database
        # Idempotent — skips if the test user already exists.
        # Creates the test user + dashboard data for the current week,
        # so live-login.spec.ts can authenticate and see content.
        run: npm run seed

      - name: Apply database migrations
        # The weekly review relies on the goals_weekStart_is_monday CHECK
        # constraint; staging must have every migration before tests run.
        run: npx prisma migrate deploy

      - name: Weekly review loop regression (gate vs review week)
        # Drives the real gate + review week resolution against staging with a
        # throwaway user. Fails if the gate can point at a week the review page
        # cannot load or clear (the /weekly-review redirect loop).
        run: npx tsx scripts/verify-weekly-review-loop.ts

      - name: Gate layout guard (no redirect in a shared layout)
        # The gates must live in route-group layouts that never wrap their own
        # redirect target; a path-based redirect in the shared (app) layout
        # caused the endless GET /weekly-review?_rsc=... loop.
        run: npx tsx scripts/verify-gate-layout.ts

      - name: Schedule rules regression
        # One block per goal (schedule_blocks.goalId UNIQUE; moving is a
        # PATCH) and at most 2 Anytime blocks per user per day (DB trigger).
        # Throwaway users on staging.
        run: npx tsx scripts/verify-schedule-rules.ts

      - name: Run Playwright tests
        # PR runs: smoke project only (excludes live-login.spec.ts which needs
        # a seeded DB with a real user). The full E2E suite is available via
        # workflow_dispatch.
        run: npx playwright test --project=smoke

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Full E2E suite — runs on demand via workflow_dispatch.
  # Requires a seeded staging database with the test user and current-week
  # dashboard data. Triggered manually from the Actions tab.
  e2e:
    name: Full E2E Suite
    timeout-minutes: 30
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true'
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      FAKE_SALT_SECRET: ${{ secrets.FAKE_SALT_SECRET }}
      FAKE_KEY_SECRET: ${{ secrets.FAKE_KEY_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Seed staging database
        run: npm run seed

      - name: Run full E2E suite
        run: npx playwright test --project=e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 30
